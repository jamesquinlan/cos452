
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Week 1 Starter -- Canvas &amp; Clear Color</title>
  <style>
    html, body { height: 100%; margin: 0; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <script>
    const canvas = document.getElementById("gl-canvas");
    const gl = canvas.getContext("webgl2");

    if (!gl) {
      throw new Error("WebGL2 is not available on this device/browser.");
    }

    function resizeCanvasToDisplaySize() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.round(canvas.clientWidth * dpr);
      const height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }
  const colors = [                                                                               
      [0.86, 0.15, 0.15],  // red                                                                                             
      [0.15, 0.55, 0.86],  // blue                                                                                            
      [0.20, 0.70, 0.35],  // green                                                                                           
      ];                                                                                                                        
                                                                                                                                
    let i = 0;                                                                                                                
    
   function render() {
    i++;
    const [r, g, b] = colors[i % colors.length];
    gl.clearColor(r, g, b, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  render();                      // draw once immediately
  setInterval(render, 1000);     // then re-draw every second

  </script>
</body>
</html>
